name: Build Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Inspect Repository Structure
        run: |
          echo "=== Дерево файлов в репозитории ==="
          ls -la
          echo "=== Поиск build.gradle ==="
          find . -name "build.gradle*"
          echo "=== Поиск файлов исходного кода ==="
          find . -name "*.java"

      - name: List Available Gradle Tasks
        run: ./gradlew tasks --all

      - name: Build Jar Explicitly
        run: ./gradlew jar --info --stacktrace

      - name: Show Build Directory Contents
        run: |
          echo "=== Что сгенерировал Gradle в папке build ==="
          find . -name "*.jar" || true

      - name: Upload Built Jar
        uses: actions/upload-artifact@v4
        with:
          name: amartaloe-1.21.1
          path: "**/*.jar"
          if-no-files-found: warn
