plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.amartaloe.mod'

base {
    archivesName = 'amartaloe'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.117'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        amartaloe {
            sourceSet project.sourceSets.main
        }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = ''
    manifest {
        attributes([
            'Specification-Title'     : 'amartaloe',
            'Specification-Vendor'    : 'amartaloe',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'amartaloe'
        ])
    }
}
